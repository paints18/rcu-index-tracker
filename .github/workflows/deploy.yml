name: Build and deploy

# Replaces branch-based Pages deployment so the editor can be kept out of the
# published site. Everything else about your workflow is unchanged: edit
# data/pets.json, push, and this publishes it.
#
# This also absorbs what codes.yml used to do. Merging the two matters: a commit
# pushed by GITHUB_TOKEN does NOT trigger further workflow runs, so if code
# assignment lived in its own workflow, the codes.json it committed would never
# get deployed until the next unrelated push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # commit data/codes.json back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assign codes to any new pets
        run: python tools/assign_codes.py

      - name: Commit updated ledger
        run: |
          if git diff --quiet -- data/codes.json; then
            echo "No new pets to code."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/codes.json
          git commit -m "chore: assign codes to new pets"
          git push

      # Explicit allowlist rather than an ignore list: a new private tool added
      # later is excluded by default instead of leaking because someone forgot
      # to update an exclusion. The editor itself never even reaches this
      # checkout — editor.html, editor.js and editor-save.js are gitignored,
      # not just unpublished — so there is nothing to strip out here anymore.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp .nojekyll _site/
          cp index.html updates.html settings.html _site/
          cp -r data _site/
          cp -r assets _site/

      # GitHub Pages caches every file for ~10 minutes (its own Cache-Control,
      # not something this repo can turn off). A plain refresh right after a
      # deploy can revalidate index.html while a script it imports is still
      # served stale from cache — a renamed element id then crashes boot()
      # against markup that no longer matches. Every reference gets a ?v= tag
      # tied to this commit, so a stale cached file is never reused under a
      # URL a new deploy expects to mean something else: it is always fetched
      # fresh instead. Data JSON already sidesteps this the other way, via
      # `cache: "no-cache"` in data.js/updates-modal.js.
      - name: Cache-bust JS and CSS
        run: |
          v="${GITHUB_SHA:0:8}"
          for f in _site/index.html _site/settings.html _site/updates.html; do
            [ -f "$f" ] || continue
            sed -i -E "s#href=\"assets/styles\.css\"#href=\"assets/styles.css?v=$v\"#; s#src=\"assets/js/main\.js\"#src=\"assets/js/main.js?v=$v\"#" "$f"
          done
          find _site/assets/js -name '*.js' -exec \
            sed -i -E "s#from \"(\./[A-Za-z0-9_-]+\.js)\"#from \"\1?v=$v\"#" {} +

      - name: Verify the editor is not published
        run: |
          found=$(find _site -name 'editor*' -print)
          if [ -n "$found" ]; then
            echo "::error::Editor files leaked into the published site:"
            echo "$found"
            exit 1
          fi
          test -f _site/index.html
          test -f _site/data/pets.json
          echo "OK — editor excluded, site looks complete."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

  # Separate job on purpose: a slug-drift failure should be loud without
  # blocking the deploy, exactly as it did before.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate.py
